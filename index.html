<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body Parts Buddy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* ============================================================
     Body Parts Buddy — an expandable body-parts animation.
     Every body part lives in the PARTS registry (bottom of file).
     To add a part: (1) draw a <g data-part="..."> in the SVG,
     (2) add an entry to PARTS, (3) add a keyframe animation here.
     ============================================================ */

  :root {
    --ground: #F0F7F2;
    --panel: #FFFFFF;
    --ink: #20423B;
    --muted: #5F7A72;
    --line: #D8E7DF;
    --teal: #3BA99C;
    --teal-deep: #2C8177;
    --coral: #FF6B57;
    --sun: #FFC24B;
    --good: #2E9E5B;
    --shadow: 0 10px 30px rgba(32, 66, 59, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12251F;
      --panel: #1B342C;
      --ink: #EAF6F0;
      --muted: #9CBCAF;
      --line: #2C4A3F;
      --teal: #46B8AA;
      --teal-deep: #338B7E;
      --coral: #FF7B67;
      --sun: #FFCB5E;
      --good: #4CC178;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #12251F;
    --panel: #1B342C;
    --ink: #EAF6F0;
    --muted: #9CBCAF;
    --line: #2C4A3F;
    --teal: #46B8AA;
    --teal-deep: #338B7E;
    --coral: #FF7B67;
    --sun: #FFCB5E;
    --good: #4CC178;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 20px 48px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 4px 0 18px;
  }
  h1 {
    font-family: "Baloo 2", "Nunito", sans-serif;
    font-weight: 800;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    margin: 0;
    letter-spacing: 0.5px;
    text-wrap: balance;
  }
  h1 .dot { color: var(--coral); }
  .controls { display: flex; gap: 10px; align-items: center; }
  .mode-switch {
    display: flex;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .mode-switch button {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--muted);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .mode-switch button.on {
    background: var(--teal);
    color: #fff;
  }
  .sound-btn {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 999px;
    width: 44px; height: 44px;
    font-size: 1.15rem;
    cursor: pointer;
  }
  button:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }

  main {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }

  /* ---------- Stage ---------- */
  .stage {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 18px 18px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bubble {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: clamp(1.15rem, 2.6vw, 1.5rem);
    background: var(--sun);
    color: #4A3200;
    border-radius: 18px;
    padding: 12px 22px;
    position: relative;
    text-align: center;
    min-height: 3.2em;
    display: flex;
    align-items: center;
    max-width: 92%;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    transform: translateX(-50%);
    border: 11px solid transparent;
    border-top-color: var(--sun);
    border-bottom: none;
  }
  .bubble.pop { animation: bubblePop 0.35s ease; }
  @keyframes bubblePop {
    0% { transform: scale(0.92); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  figure.bo { margin: 6px 0 0; width: min(100%, 380px); position: relative; }
  svg { width: 100%; height: auto; display: block; }

  [data-part] { cursor: pointer; }
  [data-part].lit { filter: drop-shadow(0 0 7px var(--sun)) drop-shadow(0 0 2px var(--sun)); }

  .character { animation: bob 3.2s ease-in-out infinite; transform-origin: 210px 350px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }
  .character.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  /* ---------- Per-part animations ----------
     Each part's `anim` in PARTS maps to a class "anim-<name>".
     Transform origins are in SVG user units (viewBox 0 0 420 520). */
  .anim-nod { animation: nod 0.9s ease; transform-origin: 210px 245px; }
  @keyframes nod {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-8deg); }
    65% { transform: rotate(7deg); }
  }
  .anim-blink #pupils { animation: blink 0.7s ease 2; transform-origin: 210px 140px; }
  @keyframes blink {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.08); }
  }
  .anim-wiggle .ear-l { animation: earL 0.8s ease; transform-origin: 118px 155px; }
  .anim-wiggle .ear-r { animation: earR 0.8s ease; transform-origin: 302px 155px; }
  @keyframes earL {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-18deg); }
    70% { transform: rotate(12deg); }
  }
  @keyframes earR {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(18deg); }
    70% { transform: rotate(-12deg); }
  }
  .anim-boop { animation: boop 0.6s ease; transform-origin: 210px 172px; }
  @keyframes boop {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.6); }
  }
  .anim-chomp { animation: chomp 0.8s ease; transform-origin: 210px 202px; }
  @keyframes chomp {
    0%, 100% { transform: scaleY(1); }
    30% { transform: scaleY(1.8); }
    60% { transform: scaleY(0.5); }
  }
  .anim-wave .arm-l { animation: waveL 1s ease; transform-origin: 128px 315px; }
  .anim-wave .arm-r { animation: waveR 1s ease; transform-origin: 292px 315px; }
  @keyframes waveL {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(150deg); }
    50% { transform: rotate(120deg); }
    70% { transform: rotate(150deg); }
  }
  @keyframes waveR {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-150deg); }
    50% { transform: rotate(-120deg); }
    70% { transform: rotate(-150deg); }
  }
  .anim-clap .hand-l { animation: clapL 0.8s ease; }
  .anim-clap .hand-r { animation: clapR 0.8s ease; }
  @keyframes clapL {
    0%, 100% { transform: translate(0, 0); }
    30%, 60% { transform: translate(55px, -30px); }
    45%, 75% { transform: translate(35px, -20px); }
  }
  @keyframes clapR {
    0%, 100% { transform: translate(0, 0); }
    30%, 60% { transform: translate(-55px, -30px); }
    45%, 75% { transform: translate(-35px, -20px); }
  }
  .anim-jiggle { animation: jiggle 0.7s ease; transform-origin: 210px 370px; }
  @keyframes jiggle {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.12, 0.9); }
    50% { transform: scale(0.92, 1.1); }
    75% { transform: scale(1.06, 0.96); }
  }
  .anim-march .leg-l { animation: stepUp 0.8s ease; }
  .anim-march .leg-r { animation: stepUp 0.8s ease 0.4s; }
  .anim-stomp .foot-l { animation: stepUp 0.7s ease; }
  .anim-stomp .foot-r { animation: stepUp 0.7s ease 0.35s; }
  @keyframes stepUp {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-26px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .character, .character *, .bubble { animation: none !important; }
  }

  /* ---------- Side panel ---------- */
  .panel { display: flex; flex-direction: column; gap: 20px; }
  .card {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .card h2 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 12px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--ground);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 7px 16px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--teal); }
  .chip.found {
    background: var(--good);
    border-color: var(--good);
    color: #fff;
  }
  [hidden] { display: none !important; }
  .scoreline {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 14px;
    color: var(--muted);
    font-weight: 700;
  }
  .scoreline strong {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.5rem;
    color: var(--coral);
    font-variant-numeric: tabular-nums;
  }
  .hint { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin: 0; }
  .hint code {
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 0.85em;
  }

  /* confetti burst on quiz success */
  .confetti {
    position: absolute;
    font-size: 1.5rem;
    pointer-events: none;
    animation: fly 0.9s ease-out forwards;
  }
  @keyframes fly {
    0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Body Parts Buddy<span class="dot">!</span></h1>
    <div class="controls">
      <div class="mode-switch" role="group" aria-label="Game mode">
        <button id="modeExplore" class="on">Explore</button>
        <button id="modeQuiz">Find it!</button>
      </div>
      <button class="sound-btn" id="soundBtn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Bo the character">
      <div class="bubble" id="bubble" aria-live="polite">Hi! I'm Bo. Tap a body part!</div>
      <figure class="bo" id="boFigure">
        <svg viewBox="0 0 420 520" role="img" aria-label="Bo, a friendly teal cartoon character">
          <g class="character" id="character">
            <!-- Arms (behind body). Each part is a <g data-part="..."> -->
            <g data-part="arms" tabindex="0" role="button" aria-label="Arms">
              <g class="arm-l">
                <path d="M 128 315 L 72 388" stroke="var(--teal-deep)" stroke-width="27" stroke-linecap="round" fill="none"/>
              </g>
              <g class="arm-r">
                <path d="M 292 315 L 348 388" stroke="var(--teal-deep)" stroke-width="27" stroke-linecap="round" fill="none"/>
              </g>
            </g>

            <!-- Legs and feet -->
            <g data-part="legs" tabindex="0" role="button" aria-label="Legs">
              <g class="leg-l"><rect x="163" y="420" width="32" height="62" rx="16" fill="var(--teal-deep)"/></g>
              <g class="leg-r"><rect x="225" y="420" width="32" height="62" rx="16" fill="var(--teal-deep)"/></g>
            </g>
            <g data-part="feet" tabindex="0" role="button" aria-label="Feet">
              <g class="foot-l"><ellipse cx="172" cy="492" rx="35" ry="16" fill="var(--coral)"/></g>
              <g class="foot-r"><ellipse cx="248" cy="492" rx="35" ry="16" fill="var(--coral)"/></g>
            </g>

            <!-- Body + tummy -->
            <rect x="188" y="225" width="44" height="40" fill="var(--teal)"/>
            <ellipse cx="210" cy="350" rx="96" ry="104" fill="var(--teal)"/>
            <g data-part="tummy" tabindex="0" role="button" aria-label="Tummy">
              <ellipse cx="210" cy="372" rx="58" ry="62" fill="#FFF3D6"/>
              <circle cx="210" cy="372" r="7" fill="var(--sun)"/>
            </g>

            <!-- Hands (in front so claps read) -->
            <g data-part="hands" tabindex="0" role="button" aria-label="Hands">
              <g class="hand-l"><circle cx="70" cy="392" r="19" fill="var(--sun)"/></g>
              <g class="hand-r"><circle cx="350" cy="392" r="19" fill="var(--sun)"/></g>
            </g>

            <!-- Head group carries the face parts so a nod moves everything -->
            <g data-part="head" tabindex="0" role="button" aria-label="Head">
              <g data-part="ears" tabindex="0" role="button" aria-label="Ears">
                <g class="ear-l"><circle cx="118" cy="155" r="24" fill="var(--teal-deep)"/></g>
                <g class="ear-r"><circle cx="302" cy="155" r="24" fill="var(--teal-deep)"/></g>
              </g>
              <circle cx="210" cy="155" r="88" fill="var(--teal)"/>
              <path d="M 200 68 Q 210 42 232 52 Q 218 56 216 72 Z" fill="var(--teal-deep)"/>
              <circle cx="150" cy="185" r="11" fill="var(--coral)" opacity="0.35"/>
              <circle cx="270" cy="185" r="11" fill="var(--coral)" opacity="0.35"/>
              <g data-part="eyes" tabindex="0" role="button" aria-label="Eyes">
                <circle cx="178" cy="140" r="17" fill="#FFFFFF"/>
                <circle cx="242" cy="140" r="17" fill="#FFFFFF"/>
                <g id="pupils">
                  <circle cx="180" cy="143" r="7.5" fill="#20423B"/>
                  <circle cx="240" cy="143" r="7.5" fill="#20423B"/>
                </g>
              </g>
              <g data-part="nose" tabindex="0" role="button" aria-label="Nose">
                <ellipse cx="210" cy="172" rx="10" ry="13" fill="var(--coral)"/>
              </g>
              <g data-part="mouth" tabindex="0" role="button" aria-label="Mouth">
                <path d="M 183 198 Q 210 222 237 198" stroke="#20423B" stroke-width="6" stroke-linecap="round" fill="none"/>
              </g>
            </g>
          </g>
        </svg>
      </figure>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>Bo's body parts</h2>
        <div class="chips" id="chips"></div>
        <div class="scoreline" id="scoreline" hidden>
          Found <strong id="score">0</strong> of <strong id="total">0</strong>
        </div>
      </div>
      <div class="card">
        <h2>Grow the game</h2>
        <p class="hint">
          Every part is one entry in the <code>PARTS</code> list plus one
          <code>&lt;g data-part&gt;</code> drawing and one animation. Add
          <code>knees</code>, <code>elbows</code>, or <code>shoulders</code>
          the same way — the chips, the quiz, and the voice pick them up
          automatically.
        </p>
      </div>
    </aside>
  </main>
</div>

<script>
  /* ============================================================
     THE PARTS REGISTRY — the one place that defines the game.
     To add a new body part:
       1. Draw it in the SVG inside <g data-part="yourpart">.
       2. Add an entry here (id must match data-part).
       3. Add a CSS animation class ".anim-yourmove".
     Chips, quiz rounds, and speech all derive from this list.
     ============================================================ */
  const PARTS = [
    { id: "head",  label: "Head",  anim: "nod",    say: "This is my head!" },
    { id: "eyes",  label: "Eyes",  anim: "blink",  say: "I see with my eyes!" },
    { id: "ears",  label: "Ears",  anim: "wiggle", say: "I hear with my ears!" },
    { id: "nose",  label: "Nose",  anim: "boop",   say: "Boop! That's my nose!" },
    { id: "mouth", label: "Mouth", anim: "chomp",  say: "I talk with my mouth!" },
    { id: "arms",  label: "Arms",  anim: "wave",   say: "I wave with my arms!" },
    { id: "hands", label: "Hands", anim: "clap",   say: "I clap with my hands!" },
    { id: "tummy", label: "Tummy", anim: "jiggle", say: "My tummy is ticklish!" },
    { id: "legs",  label: "Legs",  anim: "march",  say: "I march with my legs!" },
    { id: "feet",  label: "Feet",  anim: "stomp",  say: "I stomp with my feet!" },
  ];

  const bubble = document.getElementById("bubble");
  const character = document.getElementById("character");
  const figure = document.getElementById("boFigure");
  const chipsBox = document.getElementById("chips");
  const scoreline = document.getElementById("scoreline");
  const scoreEl = document.getElementById("score");
  const totalEl = document.getElementById("total");
  const soundBtn = document.getElementById("soundBtn");
  const modeExplore = document.getElementById("modeExplore");
  const modeQuiz = document.getElementById("modeQuiz");

  let mode = "explore";
  let soundOn = true;
  let quizTarget = null;
  let found = new Set();
  try { soundOn = localStorage.getItem("bp-sound") !== "off"; } catch (e) {}
  soundBtn.textContent = soundOn ? "🔊" : "🔇";

  function speak(text) {
    if (!soundOn) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.pitch = 1.25;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function announce(text) {
    bubble.textContent = text;
    bubble.classList.remove("pop");
    void bubble.offsetWidth;
    bubble.classList.add("pop");
  }

  function playPart(part) {
    const g = document.querySelector(`[data-part="${part.id}"]`);
    if (!g) return;
    const cls = "anim-" + part.anim;
    g.classList.remove(cls, "lit");
    void g.getBoundingClientRect();
    g.classList.add(cls, "lit");
    setTimeout(() => g.classList.remove(cls, "lit"), 1200);
  }

  function confettiBurst() {
    const emojis = ["🎉", "⭐", "💛", "🎈"];
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = emojis[i % emojis.length];
      s.style.left = "50%";
      s.style.top = "40%";
      s.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
      s.style.setProperty("--dy", (Math.random() * -180 - 40) + "px");
      figure.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  function nextQuizRound() {
    const remaining = PARTS.filter(p => !found.has(p.id));
    if (remaining.length === 0) {
      announce("You found them ALL! Amazing! 🎉");
      speak("You found them all! Amazing!");
      confettiBurst();
      quizTarget = null;
      return;
    }
    quizTarget = remaining[Math.floor(Math.random() * remaining.length)];
    announce(`Where is my ${quizTarget.label.toLowerCase()}?`);
    speak(`Where is my ${quizTarget.label}?`);
  }

  function handlePick(part) {
    if (mode === "explore") {
      announce(part.say);
      speak(part.say);
      playPart(part);
      return;
    }
    if (!quizTarget) return;
    if (part.id === quizTarget.id) {
      found.add(part.id);
      scoreEl.textContent = found.size;
      document.querySelector(`.chip[data-chip="${part.id}"]`)?.classList.add("found");
      announce(`Yes! That's my ${part.label.toLowerCase()}! 🎉`);
      speak(`Yes! That's my ${part.label}!`);
      playPart(part);
      confettiBurst();
      setTimeout(nextQuizRound, 1600);
    } else {
      announce(`That's my ${part.label.toLowerCase()} — try again!`);
      speak(`That's my ${part.label}. Try again!`);
      character.classList.remove("shake");
      void character.offsetWidth;
      character.classList.add("shake");
    }
  }

  // Build chips from the registry
  totalEl.textContent = PARTS.length;
  for (const part of PARTS) {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.chip = part.id;
    b.textContent = part.label;
    b.addEventListener("click", () => handlePick(part));
    b.addEventListener("mouseenter", () => {
      document.querySelector(`[data-part="${part.id}"]`)?.classList.add("lit");
    });
    b.addEventListener("mouseleave", () => {
      document.querySelector(`[data-part="${part.id}"]`)?.classList.remove("lit");
    });
    chipsBox.appendChild(b);
  }

  // Clicks and keyboard on the character itself
  function partFromEvent(e) {
    const g = e.target.closest("[data-part]");
    if (!g) return null;
    return PARTS.find(p => p.id === g.dataset.part) || null;
  }
  character.addEventListener("click", (e) => {
    const part = partFromEvent(e);
    if (part) { e.stopPropagation(); handlePick(part); }
  });
  character.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const part = partFromEvent(e);
    if (part) { e.preventDefault(); e.stopPropagation(); handlePick(part); }
  });

  // Mode switching
  modeExplore.addEventListener("click", () => setMode("explore"));
  modeQuiz.addEventListener("click", () => setMode("quiz"));
  function setMode(m) {
    mode = m;
    modeExplore.classList.toggle("on", m === "explore");
    modeQuiz.classList.toggle("on", m === "quiz");
    scoreline.hidden = m !== "quiz";
    if (m === "quiz") {
      found = new Set();
      scoreEl.textContent = "0";
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("found"));
      nextQuizRound();
    } else {
      quizTarget = null;
      announce("Hi! I'm Bo. Tap a body part!");
    }
  }

  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    try { localStorage.setItem("bp-sound", soundOn ? "on" : "off"); } catch (e) {}
    if (!soundOn) { try { speechSynthesis.cancel(); } catch (e) {} }
  });

  // Idle blink so Bo feels alive
  setInterval(() => {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const eyes = document.querySelector('[data-part="eyes"]');
    eyes.classList.add("anim-blink");
    setTimeout(() => eyes.classList.remove("anim-blink"), 800);
  }, 4200);
</script>
</body>
</html>
